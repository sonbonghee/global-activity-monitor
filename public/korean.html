<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한국 인터넷 이슈 모니터</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#172338;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#122540;color:white;padding:25px max(24px,calc((100vw - 1200px)/2))}h1{margin:0;font-size:25px}header p{margin:8px 0 0;color:#b9cbe0}main{max-width:1200px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border:1px solid #dce4ee;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 9px #1225400a}h2{margin:0 0 14px;font-size:19px}form{display:flex;gap:8px;flex-wrap:wrap}input,select,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #bbc9d8}input[type=text]{flex:1;min-width:180px}button{background:#1765bc;color:white;border:0;cursor:pointer}button:disabled{opacity:.55}.muted{color:#64748b}.stats{display:flex;gap:14px;flex-wrap:wrap}.stat{background:#eaf2fb;padding:10px 15px;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #e5eaf0;padding:10px;vertical-align:top}th{font-size:13px;color:#64748b}a{color:#135ca8}.badge{display:inline-block;background:#e9f1fa;border-radius:5px;padding:3px 7px;font-size:12px}.scroll{overflow:auto;max-height:650px}.issues{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.issue{border:1px solid #e0e8f1;border-radius:9px;padding:13px}.issue strong{font-size:18px}.error{color:#b42318}small{color:#64748b}nav a{color:#c9e4ff} @media(max-width:800px){.grid{grid-template-columns:1fr}header{padding:22px}}
</style></head><body><header><h1>한국 인터넷 이슈 모니터</h1><p>뉴스와 YouTube 공개 검색 결과를 모아 이슈 변화를 살펴봅니다.</p><nav><a href="/global">기존 세계 모니터</a></nav></header><main><section class="card"><h2>키워드 수집</h2><form id="search"><input id="query" type="text" placeholder="예: 서울 폭우" minlength="2" maxlength="100" required><select id="window"><option value="1h">최근 1시간</option><option value="24h" selected>최근 24시간</option><option value="7d">최근 7일</option></select><label><input type="checkbox" id="news" checked> 뉴스</label><label><input type="checkbox" id="youtube" checked> YouTube</label><button id="run">수집 실행</button></form><p id="message" class="muted">YouTube 수집은 API 키 설정 시 활성화됩니다.</p></section><section class="card"><h2>현황</h2><div class="stats" id="stats"></div></section><section class="card"><h2>급상승 이슈 후보</h2><p class="muted">수집된 항목의 키워드 빈도, 이전 기간 대비 변화, 소스 수로 계산한 후보입니다. 원문을 확인한 뒤 판단하세요.</p><div class="issues" id="issues"></div></section><div class="grid"><section class="card"><h2>검색 결과</h2><div class="scroll"><table><thead><tr><th>게시 시각</th><th>제목과 요약</th><th>출처</th></tr></thead><tbody id="items"></tbody></table></div></section><section class="card"><h2>운영 상태</h2><h3>최근 작업</h3><div class="scroll"><table><thead><tr><th>시각</th><th>검색어</th><th>상태</th><th>건수</th></tr></thead><tbody id="jobs"></tbody></table></div><h3>로그</h3><div class="scroll"><table><tbody id="logs"></tbody></table></div></section></div></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>s?new Date(s).toLocaleString('ko-KR'):'-';async function api(url,options){const r=await fetch(url,options);const v=await r.json();if(!r.ok)throw Error(v.error||'요청 실패');return v}async function refresh(){try{const w=$('window').value;const [i,c,o]=await Promise.all([api('/api/kr/items?limit=200&window=7d'),api('/api/kr/issues?window='+w),api('/api/kr/operations')]);$('stats').innerHTML=`<div class="stat">수집 원문 <b>${o.counts.items}</b>건</div><div class="stat">작업 <b>${o.counts.jobs}</b>회</div><div class="stat">오늘 YouTube 사용량 <b>${o.usage.youtubeUnits}/${o.usage.dailyBudget}</b> units</div>`;$('issues').innerHTML=c.issues.length?c.issues.slice(0,30).map(x=>`<div class="issue"><strong>${esc(x.keyword)}</strong> <span class="badge">${esc(x.category)}</span><p>${esc(x.summary)}</p><small>${x.count}건 · ${x.sourceCount}개 소스 · 이전 ${x.previousCount}건 · 변화 ${x.growthPercent===null?'신규':x.growthPercent+'%'} · 점수 ${x.score}</small></div>`).join(''):'<p class="muted">아직 이슈 후보가 없습니다. 키워드를 수집해 보세요.</p>';$('items').innerHTML=i.items.map(x=>`<tr><td><small>${date(x.publishedAt)}</small></td><td><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a><br><small>${esc(x.summary)}</small><br>${x.keywords.slice(0,5).map(k=>`<span class="badge">${esc(k)}</span>`).join(' ')}</td><td>${esc(x.source)}<br><small>${esc(x.channel)}</small></td></tr>`).join('')||'<tr><td colspan="3">수집된 결과가 없습니다.</td></tr>';$('jobs').innerHTML=o.jobs.map(j=>`<tr><td><small>${date(j.created_at)}</small></td><td>${esc(j.query)}</td><td>${esc(j.status)}</td><td>${j.results}</td></tr>`).join('');$('logs').innerHTML=o.logs.map(l=>`<tr><td><small>${date(l.created_at)}</small></td><td class="${l.level==='error'?'error':''}">${esc(l.source)}: ${esc(l.message)}</td></tr>`).join('');}catch(e){$('message').textContent=e.message;$('message').className='error'}}$('search').addEventListener('submit',async e=>{e.preventDefault();const sources=['news','youtube'].filter(s=>$(s).checked);if(!sources.length){$('message').textContent='소스를 하나 이상 선택하세요.';return}const button=$('run');button.disabled=true;$('message').textContent='수집 중입니다…';try{const r=await api('/api/kr/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('query').value,window:$('window').value,sources})});$('message').textContent=`작업 #${r.id}: ${r.results}건 수집 · ${r.status}${r.errors.length?' · '+r.errors.join(', '):''}`;await refresh()}catch(e){$('message').textContent=e.message;$('message').className='error'}finally{button.disabled=false}});$('window').addEventListener('change',refresh);refresh();setInterval(refresh,60000);
</script></body></html>
