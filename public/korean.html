<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>국내 액티비티 모니터</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
:root{--bg:#080808;--surface:#0f0f0f;--card:#161616;--line:#262626;--text:#e8e8e8;--muted:#999;--dim:#666;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;font-family:Inter,-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);display:flex;flex-direction:column}button,input,select{font:inherit}button,select,input[type=text]{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:9px 10px}button{cursor:pointer}button:hover{border-color:#555}button:disabled{opacity:.55;cursor:wait}a{color:#93c5fd}header{background:var(--surface);border-bottom:1px solid var(--line);padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}.logo{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.header-right{display:flex;gap:20px;align-items:center;font:11px ui-monospace,monospace;color:var(--muted)}.header-right b{color:var(--text)}.live{color:var(--green)}.off{color:var(--amber)}.toolbar{padding:12px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:#0d0d0d;font-size:12px}.toolbar input[type=text]{min-width:210px;flex:1;max-width:360px}.toolbar label{display:flex;align-items:center;gap:5px;color:var(--muted)}.toolbar input[type=checkbox]{accent-color:var(--green)}.primary{background:#14532d;border-color:#166534;color:#dcfce7;font-weight:600}.primary:hover{background:#166534}.message{padding:8px 24px;min-height:35px;color:var(--dim);font-size:11px;border-bottom:1px solid var(--line)}.message.error{color:var(--red)}.dashboard{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:610px;height:calc(100vh - 177px)}.stage{position:relative;min-width:0;overflow:hidden;background:radial-gradient(circle at 50% 44%,#111 0,#080808 68%)}.stage svg{width:100%;height:100%;position:absolute;inset:0}.map-hint{position:absolute;top:18px;left:22px;color:var(--dim);font:11px ui-monospace,monospace;letter-spacing:1px}.map-status{position:absolute;top:48%;left:0;right:0;text-align:center;color:var(--dim);font-size:12px}.map-status.hidden{display:none}.land{fill:#171717;stroke:#454545;stroke-width:1.5}.pin{cursor:pointer}.pin circle:first-child{opacity:.16}.pin circle:nth-child(2){stroke:#090909;stroke-width:2}.pin text{fill:#ddd;font-size:11px;paint-order:stroke;stroke:#080808;stroke-width:3px}.pin:focus{outline:none}.pin:focus circle:nth-child(2){stroke:#fff}.activity-list{position:absolute;left:20px;bottom:20px;max-height:205px;max-width:min(460px,calc(100% - 40px));overflow:auto;display:flex;flex-direction:column;gap:5px}.activity-row{border:1px solid var(--line);background:#111e;backdrop-filter:blur(8px);padding:8px 11px;border-radius:5px;text-align:left;display:flex;align-items:center;gap:9px;min-width:240px}.activity-row span:last-child{margin-left:auto;color:var(--dim);font:10px ui-monospace,monospace}.dot{width:7px;height:7px;border-radius:50%;flex:none}.sidebar{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:1px;font-weight:700;color:var(--muted)}.sidebar-head small{font-weight:400;color:var(--dim)}.feed{overflow:auto;flex:1}.feed-item{display:block;padding:13px 16px;border-bottom:1px solid #202020;text-decoration:none;color:var(--text)}.feed-item:hover{background:#1b1b1b}.feed-meta{font-size:10px;color:var(--dim);margin-bottom:6px}.feed-title{font-size:12px;line-height:1.5}.empty{padding:20px;color:var(--dim);font-size:12px}.detail{position:absolute;z-index:5;top:0;right:0;width:min(400px,100%);height:100%;background:#101010ee;backdrop-filter:blur(20px);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;overflow:auto}.detail.open{transform:translateX(0)}.detail-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:1px;color:var(--muted)}.detail-body{padding:20px}.detail h2{margin:0 0 12px;font-size:22px}.detail p{font-size:13px;color:var(--muted);line-height:1.6}.metric{display:inline-block;padding:5px 8px;background:#1d1d1d;border-radius:4px;margin:0 5px 6px 0;font-size:11px}.detail h3{font-size:11px;letter-spacing:1px;color:var(--dim);margin-top:24px}.detail a{display:block;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.5;text-decoration:none}.detail a:hover{text-decoration:underline}.bottom{border-top:1px solid var(--line);background:var(--surface);padding:10px 24px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;color:var(--dim);font-size:10px}.bottom strong{color:var(--text)}.bottom a{margin-left:auto}.ops{max-height:190px;overflow:auto;border-top:1px solid var(--line);background:#0c0c0c;padding:10px 24px;color:var(--dim);font-size:11px}.ops summary{cursor:pointer}.ops-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding-top:8px}.ops h3{font-size:11px;color:var(--muted)}.ops-row{padding:4px 0;border-bottom:1px solid #202020}.ops-row.error{color:var(--red)}@media(max-width:850px){.dashboard{grid-template-columns:1fr;height:auto}.stage{height:520px}.sidebar{height:330px;border-left:0;border-top:1px solid var(--line)}.header-right{gap:8px}.header-right .optional{display:none}}@media(max-width:540px){header,.toolbar,.message,.bottom,.ops{padding-left:12px;padding-right:12px}.brand{font-size:10px}.stage{height:450px}.activity-list{bottom:10px;left:10px}.toolbar input[type=text]{max-width:none;min-width:100%}.ops-grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="brand"><span class="logo"></span>국내 액티비티 모니터</div><div class="header-right"><span class="optional">이슈 <b id="issueCount">0</b></span><span class="optional">원문 <b id="itemCount">0</b></span><span id="liveStatus" class="off">연결 중</span><span id="clock"></span></div></header>
<form class="toolbar" id="search"><input id="query" type="text" placeholder="검색어 입력 · 예: 서울 폭우" minlength="2" maxlength="100" required aria-label="수집 키워드"><select id="window" aria-label="조회 기간"><option value="1h">최근 1시간</option><option value="24h" selected>최근 24시간</option><option value="7d">최근 7일</option></select><label><input type="checkbox" id="news" checked>뉴스</label><label><input type="checkbox" id="youtube" checked>유튜브</label><button id="run" class="primary">수집 실행</button><a href="/global">세계 모니터 →</a></form>
<div id="message" class="message" role="status">기본 감시어를 15분마다 순차 수집합니다. 유튜브 수집에는 API 키가 필요합니다.</div>
<div class="dashboard"><main class="stage"><div class="map-hint">REPUBLIC OF KOREA · ACTIVITY MAP</div><svg id="map" viewBox="0 0 960 620" role="img" aria-label="대한민국 활동 지도"><g id="land"></g><g id="pins"></g></svg><div id="mapStatus" class="map-status">지도를 불러오는 중…</div><div id="activityList" class="activity-list"></div><aside id="detail" class="detail" aria-label="이슈 상세"><div class="detail-head"><span>ACTIVITY DETAIL</span><button type="button" id="closeDetail" aria-label="상세 닫기">✕</button></div><div class="detail-body" id="detailBody"></div></aside></main><aside class="sidebar"><div class="sidebar-head"><span>SOURCE COVERAGE</span><small id="feedCount">0건</small></div><div id="feed" class="feed"><div class="empty">수집된 기사를 불러오는 중…</div></div></aside></div>
<div class="bottom"><span><span class="dot" style="display:inline-block;background:var(--red)"></span> 급증</span><span><span class="dot" style="display:inline-block;background:var(--amber)"></span> 상승</span><span><span class="dot" style="display:inline-block;background:var(--green)"></span> 관찰</span><span>키워드 빈도와 직전 기간 비교로 계산한 후보이며 원문 확인이 필요합니다.</span><a href="/global">GLOBAL ACTIVITY MONITOR</a></div>
<details class="ops"><summary>수집 작업 및 운영 상태 · <span id="jobCount">0</span>회 · 오늘 유튜브 <span id="usage">0/0</span> 단위</summary><div class="ops-grid"><section><h3>최근 작업</h3><div id="jobs"></div></section><section><h3>최근 로그</h3><div id="logs"></div></section></div></details>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const date=value=>value?new Date(value).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'-';
const shortDate=value=>value?new Date(value).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'}):'-';
const statusKo={running:'수집 중',done:'완료',partial:'일부 성공',failed:'실패'};
let activities=[],projection=null,selected=null;
function setMessage(value,error=false){$('message').textContent=value;$('message').classList.toggle('error',error);}
async function api(url,options){const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw Error(data.error||'요청에 실패했습니다.');return data;}
function tone(issue){if(issue.growthPercent!==null&&issue.growthPercent>=100&&issue.count>=3)return '#ef4444';if(issue.growthPercent!==null&&issue.growthPercent>0||issue.count>=5)return '#f59e0b';return '#22c55e';}
function showDetail(index){const issue=activities[index];if(!issue)return;selected=issue.keyword;const location=issue.location?.name||'위치 미확인';$('detailBody').innerHTML=`<h2>${esc(issue.keyword)}</h2><p>${esc(issue.summary)}</p><span class="metric">${esc(issue.category)}</span><span class="metric">${issue.count}건</span><span class="metric">출처 ${issue.sourceCount}곳</span><span class="metric">이전 ${issue.previousCount}건</span><span class="metric">변화 ${issue.growthPercent===null?'신규':issue.growthPercent+'%'}</span><p>언급 지역: ${esc(location)}<br>최근 게시: ${date(issue.updatedAt)}<br>점수: ${issue.score}</p><h3>SUPPORTING COVERAGE</h3>${issue.articles.length?issue.articles.map(item=>`<a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}<br><small>${esc(item.source)} · ${date(item.publishedAt)}</small></a>`).join(''):'<p>현재 기간에 확인 가능한 원문이 없습니다.</p>'}`;$('detail').classList.add('open');}
$('closeDetail').addEventListener('click',()=>{$('detail').classList.remove('open');selected=null});
document.addEventListener('keydown',event=>{if(event.key==='Escape')$('closeDetail').click()});
function renderMap(){const pins=$('pins');pins.replaceChildren();activities.forEach((issue,index)=>{if(!issue.location||!projection)return;const xy=projection([issue.location.lng,issue.location.lat]);if(!xy)return;const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','pin');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',`${issue.keyword}, ${issue.location.name}, ${issue.count}건`);g.setAttribute('transform',`translate(${xy[0]},${xy[1]})`);const color=tone(issue);g.innerHTML=`<circle r="17" fill="${color}"></circle><circle r="6" fill="${color}"></circle><text x="12" y="4">${esc(issue.keyword)}</text>`;g.addEventListener('click',()=>showDetail(index));g.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();showDetail(index)}});pins.append(g)});}
function renderActivities(){const list=$('activityList');list.replaceChildren();$('issueCount').textContent=activities.length;if(!activities.length){list.innerHTML='<div class="empty">아직 활동 후보가 없습니다. 키워드를 수집해 보세요.</div>';return}activities.slice(0,12).forEach((issue,index)=>{const button=document.createElement('button');button.className='activity-row';button.type='button';button.innerHTML=`<span class="dot" style="background:${tone(issue)}"></span><strong>${esc(issue.keyword)}</strong><span>${esc(issue.location?.name||'전국')} · ${issue.count}건</span>`;button.addEventListener('click',()=>showDetail(index));list.append(button)});renderMap();if(selected){const index=activities.findIndex(a=>a.keyword===selected);if(index>=0)showDetail(index);else $('closeDetail').click()}}
async function loadMap(){try{if(!window.d3||!window.topojson)throw Error('지도 라이브러리를 불러오지 못했습니다.');const world=await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');const feature=topojson.feature(world,world.objects.countries).features.find(f=>Number(f.id)===410);if(!feature)throw Error('대한민국 지도 자료가 없습니다.');projection=d3.geoMercator().fitExtent([[270,40],[700,560]],feature);d3.select('#land').append('path').datum(feature).attr('d',d3.geoPath(projection)).attr('class','land');$('mapStatus').classList.add('hidden');renderMap()}catch(error){$('mapStatus').textContent=error.message+' 아래 활동 목록은 계속 사용할 수 있습니다.'}}
async function refresh(){try{const windowValue=$('window').value;const [activityData,itemData,operations]=await Promise.all([api('/api/kr/activities?window='+windowValue),api('/api/kr/items?limit=100&window='+windowValue),api('/api/kr/operations')]);activities=activityData.activities;renderActivities();$('itemCount').textContent=operations.counts.items;$('feedCount').textContent=itemData.items.length+'건';$('feed').innerHTML=itemData.items.length?itemData.items.map(item=>`<a class="feed-item" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer"><div class="feed-meta">${esc(item.source)} · ${shortDate(item.publishedAt)}</div><div class="feed-title">${esc(item.title)}</div></a>`).join(''):'<div class="empty">이 기간에 수집된 원문이 없습니다.</div>';$('jobCount').textContent=operations.counts.jobs;$('usage').textContent=`${operations.usage.youtubeUnits}/${operations.usage.dailyBudget}`;$('jobs').innerHTML=operations.jobs.map(job=>`<div class="ops-row">${date(job.created_at)} · ${esc(job.query)} · ${esc(statusKo[job.status]||job.status)} · ${job.results}건</div>`).join('')||'<div class="empty">실행 내역 없음</div>';$('logs').innerHTML=operations.logs.map(log=>`<div class="ops-row ${log.level==='error'?'error':''}">${date(log.created_at)} · ${esc(log.source)}: ${esc(log.message)}</div>`).join('')||'<div class="empty">로그 없음</div>';$('liveStatus').className='live';$('liveStatus').textContent=operations.active?'수집 중':'LIVE';}catch(error){$('liveStatus').className='off';$('liveStatus').textContent='오프라인';setMessage(error.message,true)}}
$('search').addEventListener('submit',async event=>{event.preventDefault();const sources=['news','youtube'].filter(source=>$(source).checked);if(!sources.length){setMessage('수집할 출처를 하나 이상 선택하세요.',true);return}const button=$('run');button.disabled=true;setMessage('자료를 수집하고 있습니다…');try{const result=await api('/api/kr/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('query').value,window:$('window').value,sources})});setMessage(`작업 ${result.id}번: ${result.results}건 수집 · ${statusKo[result.status]||result.status}${result.errors.length?' · '+result.errors.join(', '):''}`,result.status==='failed');await refresh()}catch(error){setMessage(error.message,true)}finally{button.disabled=false}});
$('window').addEventListener('change',refresh);function clock(){ $('clock').textContent=new Date().toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour12:false})+' KST'}clock();setInterval(clock,1000);loadMap();refresh();setInterval(refresh,60000);
</script></body></html>
