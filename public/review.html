<body><a href="/global">← 해외 모니터</a><h1>보도 근거 검토</h1>
<p>자동 제안은 아직 검토되지 않았습니다. 원문을 열어 사건 위치와 단순 지역 언급을 구분하고, 같은 사건의 재전송·관련 보도에는 동일한 사건 묶음 ID를 지정하세요. 불확실한 판정은 모델 학습에서 제외됩니다.</p>
<p>위험도 기준: 2 제한적 영향, 5 심각한 혼란 또는 진행 중인 폭력, 8 명시적인 광범위 피해, 10 예외적인 대규모 피해. 보도가 뒷받침하는 수준만 지정하세요. 수치 기준은 잠정적입니다.</p>
<section id="progress" aria-live="polite">검토 진행 상황 불러오는 중…</section>
<label><input type="checkbox" id="reviewed" style="width:auto"> 검토한 기록 다시 보기</label><button id="export">검토 결과 내보내기</button><div id="status" role="status"></div><main id="queue"></main><button id="next">다음 목록</button>
